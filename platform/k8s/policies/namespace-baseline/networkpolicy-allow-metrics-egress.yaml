# Spec 196 FR-006 — cross-namespace metrics flows (the non-monitoring
# halves). Three additive allows; the global posture is not weakened
# (SC-005, as rescoped at implementation: at landing time NO namespace
# carried an applied default-deny — post-create.sh skips it "for MVP" —
# so these objects are the declared, forward-correct flow set).
#
#   1. stagecraft-system egress → monitoring:9090 (remote_write push,
#      FR-006 (a)). DORMANT-ADDITIVE today: stagecraft-system has no
#      default-deny, so this allow changes nothing until that
#      namespace gains one under its own spec — at which point the
#      metrics pipeline keeps working instead of silently dropping
#      (the spec's named edge case).
#   2. deployd-system ingress ← monitoring on the deployd-api metrics
#      port (FR-006 (b) destination half).
#   3. ingress-nginx ingress ← monitoring on the controller metrics
#      port (FR-006 (b) destination half).
#
# flux-system needs no object here: Flux ships its own
# `allow-scraping` policy (gotk-components.yaml) admitting :8080
# ingress from every namespace — bootstrap-managed upstream posture,
# not ours to fork.
#
# Applied by the `policies` Flux Kustomization (see
# platform/k8s/policies/kustomization.yaml).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-remote-write-egress-to-monitoring
  namespace: stagecraft-system
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9090
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-ingress-from-monitoring
  namespace: deployd-system
spec:
  podSelector:
    matchLabels:
      app: deployd-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-ingress-from-monitoring
  namespace: ingress-nginx
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 10254
          protocol: TCP

# Spec: 085-remote-control-cli
#
# AI-Powered PR Review. Uses Claude CLI to review diffs for bugs, security
# issues, and spec compliance.
#
# Hardening notes (ci-hardening branch):
#   - H3: diff payload is passed to Claude via stdin instead of `$(cat …)`
#     interpolation, eliminating shell-evaluation of backticks/$( ) inside
#     contributor-controlled diff content.
#   - H4: Claude CLI version pinned via env var (CLAUDE_CLI_VERSION) so
#     dependabot bumps land in one place.
#   - M6: draft PRs are skipped to avoid burning Anthropic tokens on WIP.

name: AI PR Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

env:
  # Pinned to the npm `stable` dist-tag value at time of pin. The 2.1.88
  # value previously here was never published — the version sequence skips
  # numbers as releases are pulled. Bump in lockstep with ai-changelog.yml.
  CLAUDE_CLI_VERSION: '2.1.116'
  DIFF_SIZE_CAP: '2000'

jobs:
  ai-review:
    runs-on: ubuntu-latest
    name: ai-review / diff scan
    timeout-minutes: 10
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Compute diff size
        id: diff
        run: |
          DIFF_LINES=$(git diff origin/main...HEAD --stat | tail -1 | grep -oP '\d+ insertion' | grep -oP '\d+' || echo "0")
          echo "lines=$DIFF_LINES" >> "$GITHUB_OUTPUT"
          if [ "$DIFF_LINES" -gt "$DIFF_SIZE_CAP" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate diff
        if: steps.diff.outputs.skip != 'true'
        run: git diff origin/main...HEAD > /tmp/pr-diff.txt

      - name: Install Claude CLI
        if: steps.diff.outputs.skip != 'true'
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CLI_VERSION}"

      # H3 fix: prompt prelude is fed via -p; the diff is piped to stdin.
      # No shell interpolation of contributor-controlled content occurs.
      - name: Run AI Review
        if: steps.diff.outputs.skip != 'true'
        env:
          # Subscription-backed auth via the Claude Code OAuth token, NOT an
          # API key. ANTHROPIC_API_KEY is deliberately NOT set here: an
          # empty/unset API key wins by precedence over the OAuth token and
          # was the silent auth failure that made every review since ~#220
          # emit "Review generation failed" while the job stayed green.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -o pipefail
          # Distinct, surfaced failure if the OAuth secret is unset, so an
          # operator can tell "secret missing" from "API error" without
          # decoding a generic CLI failure (raised by the AI review on #265).
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret is unset — AI review cannot authenticate."
            exit 1
          fi
          PROMPT='You are reviewing a pull request for the Open Agentic Platform. The diff is provided on stdin. Review it for:
          1. Bugs and logic errors
          2. Security vulnerabilities (OWASP top 10)
          3. Spec compliance (check that Feature: annotations match code_aliases in specs/)
          4. Performance concerns

          Be concise. Focus on issues, not praise. Format as markdown with ## sections.'
          # No `|| echo` swallow: let claude's real exit code and stderr
          # surface in the runner log so an auth failure can't masquerade as
          # a green check. On failure this step exits non-zero and the
          # "Post review comment" step (implicit success() in its `if`) is
          # skipped — yielding a red check + visible stderr, never a
          # misleading "passed" comment. Promoting this into the required
          # `ci-gate` is a deliberate follow-up, gated on first confirming a
          # review genuinely runs under the OAuth token.
          claude -p "$PROMPT" --output-format text < /tmp/pr-diff.txt > /tmp/review.md

      - name: Post review comment
        # Explicit success() (raised by the AI review on #265): the post step
        # must run only when Run AI Review succeeded, so a future
        # `continue-on-error` can't let it post a partial/empty review.
        if: success() && steps.diff.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DIFF_LINES: ${{ steps.diff.outputs.lines }}
        run: |
          {
            echo "## AI Code Review"
            echo ""
            cat /tmp/review.md
            echo ""
            echo "---"
            echo "_Automated review by Claude. Diff size: ${DIFF_LINES} lines._"
          } > /tmp/comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md

      - name: Skip notice
        if: steps.diff.outputs.skip == 'true'
        run: echo "::notice::Skipping AI review — diff exceeds ${DIFF_SIZE_CAP} lines (${{ steps.diff.outputs.lines }})"

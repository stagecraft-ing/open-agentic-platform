# Spec: 001-spec-compiler-mvp
# Spec: 002-registry-consumer-mvp
# Spec: 006-conformance-lint-mvp
# Spec: 177-ci-orchestrator-pr-gate
#
# Machine-check emitted JSON against Feature 000 schemas (see
# specs/001-spec-compiler-mvp/tasks.md task T014). Plus registry-consumer
# contract subsets, spec-lint, codebase-indexer compile + tests, and policy
# compiler tests.
#
# Dispatched unconditionally from `.github/workflows/ci.yml` (spec 177
# §2.2 constitutional carve-out) — spec-spine conformance is the
# foundational gate.

name: Spec conformance

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spec-compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # Disk headroom (spec 135 FR-05a, amendment 2026-06-11): this job
      # stacks six per-tool release target dirs in one workspace, and its
      # merge_group instance ENOSPC'd on a hosted runner (run 27371047814,
      # rustc LLVM "IO failure on output stream"). The local composite
      # reclaims ~25 GB on hosted runners only (guard inside the action).
      - uses: ./.github/actions/free-disk-space

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # pinned for rust-toolchain.toml lockstep
        with:
          toolchain: '1.95.0'

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: spec-conformance

      - name: Build spec-compiler
        run: cargo build --release --manifest-path tools/spec-spine/spec-compiler/Cargo.toml --target-dir tools/spec-spine/spec-compiler/target

      - name: Emit registry (smoke)
        run: ./tools/spec-spine/spec-compiler/target/release/spec-compiler compile

      - name: Build oap-registry-enrich (Cut D W-06a)
        run: cargo build --release --manifest-path tools/oap/oap-registry-enrich/Cargo.toml --target-dir tools/oap/oap-registry-enrich/target

      - name: Emit registry-oap.json (OAP-specific overlay)
        run: ./tools/oap/oap-registry-enrich/target/release/oap-registry-enrich

      - name: Tests (golden, schema conformance, exit codes)
        run: cargo test --manifest-path tools/spec-spine/spec-compiler/Cargo.toml

      - name: Build registry-consumer (Feature 002)
        run: cargo build --release --manifest-path tools/spec-spine/registry-consumer/Cargo.toml --target-dir tools/spec-spine/registry-consumer/target

      - name: Registry consumer smoke + tests
        run: |
          ./tools/spec-spine/registry-consumer/target/release/registry-consumer list | head -n 5
          cargo test --manifest-path tools/spec-spine/registry-consumer/Cargo.toml

      # `--all` (= --workspace) was dropped from these ten invocations on
      # 2026-06-11: it made each one build the ENTIRE root workspace's
      # test targets into the shared target/ directory, which is the disk
      # profile that ENOSPC'd merge_group run 27371047814. The contract
      # filters only ever matched registry-consumer tests (verified: no
      # fn or mod name elsewhere in the repo contains these substrings),
      # so the package-scoped form runs the identical test set.
      - name: Registry consumer contract subsets (governance gate)
        run: |
          cargo test --manifest-path tools/spec-spine/registry-consumer/Cargo.toml readme_
          cargo test --manifest-path tools/spec-spine/registry-consumer/Cargo.toml error_contract_
          cargo test --manifest-path tools/spec-spine/registry-consumer/Cargo.toml shape_contract_
          cargo test --manifest-path tools/spec-spine/registry-consumer/Cargo.toml help_contract_
          cargo test --manifest-path tools/spec-spine/registry-consumer/Cargo.toml arg_contract_
          cargo test --manifest-path tools/spec-spine/registry-consumer/Cargo.toml version_contract_
          cargo test --manifest-path tools/spec-spine/registry-consumer/Cargo.toml default_path_contract_
          cargo test --manifest-path tools/spec-spine/registry-consumer/Cargo.toml allow_invalid_contract_
          cargo test --manifest-path tools/spec-spine/registry-consumer/Cargo.toml sorting_contract_
          cargo test --manifest-path tools/spec-spine/registry-consumer/Cargo.toml channel_contract_

      - name: Build spec-lint (Feature 006)
        run: cargo build --release --manifest-path tools/spec-spine/spec-lint/Cargo.toml --target-dir tools/spec-spine/spec-lint/target

      - name: spec-lint (strict; spec 128 amends 006)
        run: ./tools/spec-spine/spec-lint/target/release/spec-lint --fail-on-warn

      - name: spec-lint tests
        run: cargo test --manifest-path tools/spec-spine/spec-lint/Cargo.toml

      # Broad codebase-index staleness is no longer a required PR gate
      # (spec 188 Phase 3): the broad index is a best-effort cache, drift
      # surfaced post-merge by cd-index-staleness-report.yml; the narrow
      # PR-time gate is the check-config step below (re-homed here from the
      # standalone ci-config-hash.yml on 2026-06-10). Smoke + tests still
      # run here because they belong to the spec-tooling conformance bundle.
      - name: Build codebase-indexer (Feature 101)
        run: cargo build --release --manifest-path tools/spec-spine/codebase-indexer/Cargo.toml --target-dir tools/spec-spine/codebase-indexer/target

      # Spec 184/188 narrow config-hash gate — same binary, same guarantee
      # as the deleted ci-config-hash.yml job, one fewer runner spin-up.
      # ORDER MATTERS: this validates the COMMITTED
      # .derived/codebase-index/config-hash.json against the current
      # .claude/settings.json + .mcp.json, so it MUST run before the
      # `compile` smoke step below, which regenerates that file and would
      # otherwise make this check vacuously green.
      - name: Check config-hash slice (spec 184 gate)
        run: ./tools/spec-spine/codebase-indexer/target/release/codebase-indexer check-config

      - name: Emit codebase index (smoke)
        run: ./tools/spec-spine/codebase-indexer/target/release/codebase-indexer compile

      - name: Build oap-code-index-enrich (Cut D W-07a)
        run: cargo build --release --manifest-path tools/oap/oap-code-index-enrich/Cargo.toml --target-dir tools/oap/oap-code-index-enrich/target

      - name: Emit index-oap.json (OAP-specific overlay)
        run: ./tools/oap/oap-code-index-enrich/target/release/oap-code-index-enrich

      - name: Codebase index tests
        run: cargo test --manifest-path tools/spec-spine/codebase-indexer/Cargo.toml

      - name: Build policy-compiler
        run: cargo build --release --manifest-path tools/oap/policy-compiler/Cargo.toml --target-dir tools/oap/policy-compiler/target

      - name: Policy compiler tests
        run: cargo test --manifest-path tools/oap/policy-compiler/Cargo.toml

# Spec: 188-derived-index-merge-serialization
# Spec: 101-codebase-index-mvp
#
# Post-merge codebase-index heal (spec 188 Phase 3, FR-007). On every push
# to `main`, regenerate `.derived/codebase-index/index.json` and commit it
# back under a bot identity, so the committed index stays a fresh
# present-on-clone cache WITHOUT requiring every PR to carry a fresh broad
# index. This is what removes the merge-serialization pains (i) textual
# conflict and (ii) semantic staleness at their source: PRs no longer need
# to regenerate the broad index.
#
# FAIL-LOUD CONFIG GUARD (spec 188 §"back-door corollary" / FR-009): before
# healing, verify the committed config slice (`build.claudeConfigHash`)
# still matches `.claude/settings.json` + `.mcp.json`. If `main` carries
# config drift, the narrow `ci-config-hash` PR gate was bypassed — that is
# an incident, NOT something to silently regenerate-and-commit. The heal
# FAILS instead of absorbing it, so spec 184's "a config edit cannot merge
# unacknowledged" guarantee is never quietly defeated by the heal itself.
# (Hardening the front door — the PR gate — while leaving this side door
# open would erase the guarantee.)
#
# NOT a PR gate: this is a `cd-*` post-merge workflow, parity-exempt by the
# spec 104 §5 precedent (cd-*.yml are delegators/healers, not enforcing CI).

name: CD index-heal

on:
  push:
    branches: [main]
    # The heal's own commit only touches `.derived/**`; ignore that path so
    # the heal never re-triggers itself (belt-and-braces with the fact that
    # GITHUB_TOKEN pushes do not trigger downstream workflow runs).
    paths-ignore:
      - '.derived/**'

permissions:
  contents: write

# Serialize heals on main so two rapid merges cannot race to commit the
# index. Do not cancel an in-flight heal — each must complete its commit.
concurrency:
  group: index-heal-main
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Build spec toolchain (cached)
        uses: ./.github/actions/rust-ci
        with:
          manifest-path: tools/spec-spine/codebase-indexer/Cargo.toml
          cache-shared-key: codebase-indexer

      - name: Compile codebase-indexer + spec-compiler release binaries
        run: |
          cargo build --release --manifest-path tools/spec-spine/codebase-indexer/Cargo.toml --target-dir tools/spec-spine/codebase-indexer/target
          cargo build --release --manifest-path tools/spec-spine/spec-compiler/Cargo.toml --target-dir tools/spec-spine/spec-compiler/target

      - name: Fail-loud config guard — do NOT silently heal config drift
        run: |
          if ! ./tools/spec-spine/codebase-indexer/target/release/codebase-indexer check-config; then
            echo "::error title=Config drift on main::main carries Claude shared-config drift (.claude/settings.json / .mcp.json)."
            echo "::error::The ci-config-hash PR gate was bypassed. Per spec 188 FR-009 / spec 184, the heal refuses to"
            echo "::error::silently regenerate-and-commit the config slice. Investigate how a config edit reached main"
            echo "::error::unacknowledged, then regenerate the index in a tracked, reviewed PR."
            exit 1
          fi

      - name: Regenerate broad index
        run: make registry

      - name: Commit healed index if it changed
        run: |
          if git diff --quiet -- .derived/codebase-index/index.json; then
            echo "index already fresh on main; nothing to heal"
            exit 0
          fi
          git config user.name  "oap-index-heal[bot]"
          git config user.email "oap-index-heal@users.noreply.github.com"
          git add .derived/codebase-index/index.json
          git commit -m "chore(index): post-merge heal of codebase-index (spec 188 Phase 3)"
          git push

# Spec: 177-ci-orchestrator-pr-gate
#
# Single PR-time orchestrator. Branch protection's required check on
# `main` is the terminal `ci-gate` job — every other PR-gate workflow
# (the `ci-*.yml` fleet plus `spec-conformance.yml`) is reusable
# (`workflow_call:`) and dispatched from here.
#
# Routing: a `changes` job runs dorny/paths-filter against the diff and
# emits one boolean output per routed workflow. Each routed reusable is
# gated on its filter; constitutional gates (spec 177 §2.2) skip the
# filter and always run on PRs. The `ci-gate` aggregator treats `skipped`
# as success — that's the entire point of conditional dispatch — and
# fails the build on any upstream `failure` or `cancelled`.
#
# `ci-spec-code-coupling` is PR-only by design (spec 127 reads PR
# base/head SHAs); the other always-on workflows run for push-to-main
# too, mirroring their pre-spec-177 push-trigger coverage.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Spec 188 Phase 2 — GitHub merge queue. Each queued PR is tested against
  # the speculative merged tree, so a green PR can't be silently invalidated
  # by the one ahead of it, and conflicts that pass alone but break together
  # (e.g. the spec-id-186 collision class) are caught before reaching main.
  # INERT until a repo admin enables the merge queue in branch protection
  # and requires `ci-gate` on merge_group — honouring FR-006's "Phase 2
  # strictly after Phase 3" as an ops ordering.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  # ─── route ─────────────────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    name: route / paths-filter
    timeout-minutes: 5
    # Spec 188 Phase 2: on `merge_group` the paths-filter step is skipped
    # (a merge group has no PR base to diff against), so every output falls
    # back to `true` and the full suite runs against the speculative merged
    # tree. On `pull_request` the filter drives them as before.
    outputs:
      axiomregent: ${{ steps.f.outputs.axiomregent == 'true' || github.event_name == 'merge_group' }}
      crates: ${{ steps.f.outputs.crates == 'true' || github.event_name == 'merge_group' }}
      deployd_api_rs: ${{ steps.f.outputs.deployd_api_rs == 'true' || github.event_name == 'merge_group' }}
      desktop: ${{ steps.f.outputs.desktop == 'true' || github.event_name == 'merge_group' }}
      featuregraph: ${{ steps.f.outputs.featuregraph == 'true' || github.event_name == 'merge_group' }}
      orchestrator: ${{ steps.f.outputs.orchestrator == 'true' || github.event_name == 'merge_group' }}
      parity: ${{ steps.f.outputs.parity == 'true' || github.event_name == 'merge_group' }}
      policy_kernel: ${{ steps.f.outputs.policy_kernel == 'true' || github.event_name == 'merge_group' }}
      schema_parity: ${{ steps.f.outputs.schema_parity == 'true' || github.event_name == 'merge_group' }}
      stagecraft: ${{ steps.f.outputs.stagecraft == 'true' || github.event_name == 'merge_group' }}
      tenant_hello: ${{ steps.f.outputs.tenant_hello == 'true' || github.event_name == 'merge_group' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: f
        # Run on pull_request and push (both have a base to diff); skip only
        # on merge_group, which has none — the outputs fall back to `true`.
        if: github.event_name != 'merge_group'
        with:
          filters: |
            axiomregent:
              - 'crates/axiomregent/**'
              - 'crates/agent/**'
              - 'crates/featuregraph/**'
              - 'crates/xray/**'
              - 'crates/run/**'
              - 'crates/policy-kernel/**'
              - '.github/workflows/ci-axiomregent.yml'
            crates:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - 'tools/spec-spine/**'
              - 'tools/oap/**'
              - 'tools/shared/**'
              - '.github/workflows/ci-crates.yml'
            deployd_api_rs:
              - 'platform/services/deployd-api-rs/**'
              - 'platform/charts/**'
              - '.github/workflows/ci-deployd-api-rs.yml'
            desktop:
              - 'product/apps/opc/**'
              - 'crates/**'
              - 'product/packages/**'
              - '.github/workflows/ci-desktop.yml'
            featuregraph:
              - 'specs/**'
              - 'tools/spec-spine/spec-compiler/**'
              - 'crates/featuregraph/**'
              - '.github/workflows/ci-featuregraph-golden.yml'
            orchestrator:
              - 'crates/orchestrator/**'
              - 'crates/provider-registry/**'
              - 'crates/standards-loader/**'
              - '.github/workflows/ci-orchestrator.yml'
            parity:
              - '.github/workflows/**'
              - 'Makefile'
              - 'tools/oap/ci-parity-check/**'
            policy_kernel:
              - 'crates/policy-kernel/**'
              - '.github/workflows/ci-policy-kernel.yml'
            schema_parity:
              - 'crates/factory-contracts/**'
              - 'platform/services/stagecraft/api/knowledge/**'
              - 'platform/services/stagecraft/api/governance/**'
              - 'platform/services/stagecraft/api/sync/**'
              - 'product/apps/opc/src-tauri/src/commands/sync_client.rs'
              - 'tools/oap/schema-parity-check/**'
              - '.github/workflows/ci-schema-parity.yml'
            stagecraft:
              - 'platform/services/stagecraft/**'
              - '.github/workflows/ci-stagecraft.yml'
            tenant_hello:
              - 'platform/services/tenant-hello/**'
              - 'platform/charts/tenant-hello/**'
              - '.github/workflows/ci-tenant-hello.yml'

  # ─── routed by paths-filter ────────────────────────────────────────────
  axiomregent:
    needs: changes
    if: needs.changes.outputs.axiomregent == 'true'
    uses: ./.github/workflows/ci-axiomregent.yml

  crates:
    needs: changes
    if: needs.changes.outputs.crates == 'true'
    uses: ./.github/workflows/ci-crates.yml

  deployd-api-rs:
    needs: changes
    if: needs.changes.outputs.deployd_api_rs == 'true'
    uses: ./.github/workflows/ci-deployd-api-rs.yml

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    uses: ./.github/workflows/ci-desktop.yml

  featuregraph-golden:
    needs: changes
    if: needs.changes.outputs.featuregraph == 'true'
    uses: ./.github/workflows/ci-featuregraph-golden.yml

  orchestrator:
    needs: changes
    if: needs.changes.outputs.orchestrator == 'true'
    uses: ./.github/workflows/ci-orchestrator.yml

  parity:
    needs: changes
    if: needs.changes.outputs.parity == 'true'
    uses: ./.github/workflows/ci-parity.yml

  policy-kernel:
    needs: changes
    if: needs.changes.outputs.policy_kernel == 'true'
    uses: ./.github/workflows/ci-policy-kernel.yml

  schema-parity:
    needs: changes
    if: needs.changes.outputs.schema_parity == 'true'
    uses: ./.github/workflows/ci-schema-parity.yml

  stagecraft:
    needs: changes
    if: needs.changes.outputs.stagecraft == 'true'
    uses: ./.github/workflows/ci-stagecraft.yml

  tenant-hello:
    needs: changes
    if: needs.changes.outputs.tenant_hello == 'true'
    uses: ./.github/workflows/ci-tenant-hello.yml

  # ─── constitutional (always-run, spec 177 §2.2) ────────────────────────
  spec-conformance:
    uses: ./.github/workflows/spec-conformance.yml

  spec-code-coupling:
    # PR-only: spec 127 reads PR base/head SHAs.
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/ci-spec-code-coupling.yml

  supply-chain:
    uses: ./.github/workflows/ci-supply-chain.yml

  # Spec 188 Phase 3: the NARROW config-hash gate replaces the broad
  # ci-codebase-index staleness gate in the constitutional always-on set.
  # It blocks a quiet `.claude/settings.json` / `.mcp.json` edit (spec 184)
  # but depends only on those two files, so it survives a merge queue.
  # The broad index freshness now heals post-merge (cd-index-heal.yml).
  config-hash:
    uses: ./.github/workflows/ci-config-hash.yml

  # ─── aggregator ────────────────────────────────────────────────────────
  ci-gate:
    name: ci-gate
    if: always()
    needs:
      - changes
      - axiomregent
      - crates
      - deployd-api-rs
      - desktop
      - featuregraph-golden
      - orchestrator
      - parity
      - policy-kernel
      - schema-parity
      - stagecraft
      - tenant-hello
      - spec-conformance
      - spec-code-coupling
      - supply-chain
      - config-hash
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Aggregate upstream results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -u
          echo "$RESULTS"
          # `failure` / `cancelled` block merge; `skipped` (path-filter said
          # "don't run", or job opted out via its own `if:`) and `success`
          # pass. The aggregator is the merge contract — keep it small.
          if echo "$RESULTS" | jq -e '
              to_entries
              | map(.value.result)
              | any(. == "failure" or . == "cancelled")
            ' > /dev/null; then
            echo "::error::one or more upstream jobs failed or were cancelled"
            exit 1
          fi
          echo "all upstream jobs satisfied (success or skipped)"

# Spec: 101-codebase-index-mvp
# Spec: 103-init-protocol-governed-reads
# Spec: 177-ci-orchestrator-pr-gate
#
# Codebase-index staleness gate. The committed `.derived/codebase-index/index.json`
# hashes inputs across crates/, product/, platform/services/**, and
# tools/. This gate fails the build if any of those inputs changed without
# `codebase-indexer compile` being re-run and the result committed.
#
# Dispatched unconditionally from `.github/workflows/ci.yml` (spec 177
# §2.2 constitutional carve-out) — the staleness invariant defends the
# governed-read substrate and must run on every PR regardless of paths.

name: CI codebase-index

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  staleness:
    runs-on: ubuntu-latest
    name: codebase-index / staleness check
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Build codebase-indexer
        uses: ./.github/actions/rust-ci
        with:
          manifest-path: tools/spec-spine/codebase-indexer/Cargo.toml
          cache-shared-key: codebase-indexer

      - name: Compile codebase-indexer release binary
        run: cargo build --release --manifest-path tools/spec-spine/codebase-indexer/Cargo.toml --target-dir tools/spec-spine/codebase-indexer/target

      - name: Staleness check (committed artifact)
        run: ./tools/spec-spine/codebase-indexer/target/release/codebase-indexer check

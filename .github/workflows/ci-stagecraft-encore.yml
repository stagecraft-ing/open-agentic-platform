# Spec: 211-encore-test-ci-job
#
# DB-bound encore-test lane for stagecraft (ASI09 — verification integrity).
#
# vite.config.ts splits the stagecraft suite into two lanes: pure suites run
# under bare vitest (the `ci-stagecraft.yml` job), DB-bound suites — excluded
# under bare vitest — run only under `encore test`, which provisions per-test
# Postgres databases via the Encore daemon + Docker. Before this lane existed
# no CI job ran `encore test`, so DB-bound acceptance suites could rot
# invisibly (spec 198 FR-013 records the proven instance; the spec 211
# implementation log records eleven more found on first run).
#
# Three steps carry the contract:
#   1. `encore-test-lane.mjs list` derives the DB-bound file set from the
#      vite.config.ts exclude list (phantom entries fail, naming the glob).
#   2. `encore test --run <files>` executes exactly that set against
#      Encore-provisioned databases, with a JSON reporter capture. Any
#      provisioning failure (daemon, image pull, migration error) fails the
#      job with its cause — never skipped-green (FR-004).
#   3. `encore-test-lane.mjs check` cross-checks the reporter output against
#      the exclude list: a DB-bound file that did not execute at least one
#      non-skipped test fails the job naming the file (FR-003).
#
# Dispatched from `.github/workflows/ci.yml` on PRs touching the stagecraft
# service (spec 177) and in merge_group with identical blocking semantics
# (AC-5); manual via workflow_dispatch. Mirrored locally by
# `make ci-stagecraft-encore` (spec 104 parity contract).

name: CI stagecraft encore

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  ENCORE_VERSION: '1.57.8'

jobs:
  encore-test:
    runs-on: ubuntu-latest
    name: encore test (DB-bound lane)
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/services/stagecraft/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: platform/services/stagecraft

      - name: Install Encore CLI
        uses: ./.github/actions/encore-install
        with:
          encore-version: ${{ env.ENCORE_VERSION }}

      # Encore parses every service before running tests, and
      # `web/api.gateway.ts` registers `api.static({ dir: "./build/client/assets" })`
      # — the parser fails fast if that directory is missing. Same first step
      # as ci-stagecraft.yml's typecheck job and the encore-build action.
      - name: Build frontend
        shell: bash
        working-directory: platform/services/stagecraft
        run: cd web && npx react-router build

      - name: Resolve DB-bound lane (exclude-list derivation)
        working-directory: platform/services/stagecraft
        run: node scripts/encore-test-lane.mjs list > /tmp/encore-lane-files.txt

      # --fileParallelism=false: the DB-bound suites share one database and
      # are not parallel-safe by design — the migration-replay suites (36/40/41)
      # mutate corpus-wide state (e.g. migration 36 inserts a synthetic row per
      # org), so concurrent files see each other's seeds. Sequential execution
      # is the lane's correctness posture, not an optimisation knob.
      - name: Encore test (DB-bound suites, per-test databases)
        shell: bash
        working-directory: platform/services/stagecraft
        run: CI=true encore test --run $(cat /tmp/encore-lane-files.txt) --fileParallelism=false --reporter=default --reporter=json --outputFile=/tmp/encore-test-report.json

      - name: Lane-coverage guard (skip-as-pass forbidden)
        working-directory: platform/services/stagecraft
        run: node scripts/encore-test-lane.mjs check --report /tmp/encore-test-report.json

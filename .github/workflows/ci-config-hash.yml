# Spec: 184-claude-shared-config-governance
# Spec: 188-derived-index-merge-serialization
# Spec: 177-ci-orchestrator-pr-gate
#
# Narrow Claude shared-config staleness gate (spec 188 Phase 3). Verifies
# that `.claude/settings.json` + `.mcp.json` match the committed
# `build.claudeConfigHash` in `.derived/codebase-index/index.json`.
#
# This is the PR-time (and `merge_group`) blocking gate that preserves
# spec 184's guarantee — a quiet edit to either file cannot merge
# unacknowledged — after the BROAD index-freshness check stopped being a
# required PR gate (the broad index is now a best-effort cache; drift is
# surfaced post-merge by `cd-index-staleness-report.yml`, spec 188
# FR-007/008).
# Because the config slice depends ONLY on those two files, this gate
# stays valid in a merge queue regardless of unrelated input churn
# (FR-006 robustness): a config-touching PR is never ejected by another
# PR's unrelated code change.
#
# Dispatched unconditionally from `.github/workflows/ci.yml` (spec 177
# §2.2 constitutional carve-out) — the config-governance invariant must
# run on every PR regardless of paths, replacing `ci-codebase-index.yml`
# in that always-on set.

name: CI config-hash

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  config-hash:
    runs-on: ubuntu-latest
    name: config-hash / check-config
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Build codebase-indexer
        uses: ./.github/actions/rust-ci
        with:
          manifest-path: tools/spec-spine/codebase-indexer/Cargo.toml
          cache-shared-key: codebase-indexer

      - name: Compile codebase-indexer release binary
        run: cargo build --release --manifest-path tools/spec-spine/codebase-indexer/Cargo.toml --target-dir tools/spec-spine/codebase-indexer/target

      - name: Config-slice staleness check (committed artifact)
        run: ./tools/spec-spine/codebase-indexer/target/release/codebase-indexer check-config

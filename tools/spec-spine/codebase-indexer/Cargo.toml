[package]
name = "open_agentic_codebase_indexer"
publish = false   # internal workspace crate; binaries ship via release workflows, not crates.io
version = "0.1.0"
edition = "2024"
description = "Codebase indexer per specs/101-codebase-index-mvp — emits index.json + build-meta.json"
rust-version = "1.85"

[[bin]]
name = "codebase-indexer"
path = "src/main.rs"

[lib]
name = "open_agentic_codebase_indexer"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive"] }
jsonschema = { version = "0.46", default-features = false }
open_agentic_spec_types = { path = "../../shared/spec-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
toml = "0.8"
# Spec 154 Segment 3 — symbol / module index built from a tree-sitter
# pass over `*.rs` files. The grammar is vendored at
# `tools/vendor/grammars/tree-sitter-rust`; mirror xray's pattern
# (`crates/xray/Cargo.toml:37`) but without the feature gate — the
# resolver is non-optional here.
tree-sitter = "0.26"
tree-sitter-rust = { path = "../../vendor/grammars/tree-sitter-rust" }
walkdir = "2"
# Spec 154 §3.7 (amended 2026-05-24) — resolver honors committed
# `.gitignore` files in addition to the baseline exclusion list.
# `ignore::WalkBuilder` is configured at the call site with
# `git_ignore(true).git_exclude(false).git_global(false)` so behavior
# stays deterministic across machines.
ignore = "0.4"

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["plotters", "cargo_bench_support"] }
tempfile = "3.27.0"

[[bench]]
name = "resolver"
harness = false

[package.metadata.oap]
spec = "101-codebase-index-mvp"
